# Spring Boot Server Port
server.port=8080

# OAuth2 Client Credentials (Injected from OpenShift Environment Variables or Secrets if present)
# Standard defaults provided for local development testing
app.oauth.client-id=${OAUTH_CLIENT_ID:maximo-client}
app.oauth.client-secret=${OAUTH_CLIENT_SECRET:CHANGE_ME_STRONG_SECRET}

# Recognize X-Forwarded-Proto (HTTPS) header from OpenShift Ingress / Reverse Proxy
server.forward-headers-strategy=native

