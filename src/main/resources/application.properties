# Spring Boot Server Port
server.port=8080

# Required OAuth2 client credentials
app.oauth.client-id=${OAUTH_CLIENT_ID}
app.oauth.client-secret=${OAUTH_CLIENT_SECRET}

# Required Maximo connection settings
app.maximo.script-base-url=${MAXIMO_SCRIPT_BASE_URL}
app.maximo.api-key=${MAXIMO_API_KEY}

# Shared RSA signing keys mounted as read-only files
app.jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION:file:/etc/maximo-oauth2/jwt/private-key.pem}
app.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:file:/etc/maximo-oauth2/jwt/public-key.pem}
app.jwt.issuer=${JWT_ISSUER:maximo-oauth2}
app.jwt.audience=${JWT_AUDIENCE:maximo-api}
app.jwt.key-id=${JWT_KEY_ID:maximo-oauth2-primary}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:1800}

# OpenShift must use HTTPS at the Route. Set REQUIRE_HTTPS=false only for local HTTP development.
app.security.require-https=${REQUIRE_HTTPS:true}

# Recognize X-Forwarded-Proto (HTTPS) header from OpenShift Ingress / Reverse Proxy
server.forward-headers-strategy=native

# Include a validated request identifier in every application log line.
logging.pattern.level=%5p [requestId:%X{requestId:-none}]

