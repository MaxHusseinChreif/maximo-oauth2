services:
  app:
    image: maxplushchreif/maximo-oauth2-app
    container_name: maximo-oauth2
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:?OAUTH_CLIENT_ID is required}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:?OAUTH_CLIENT_SECRET is required}
      MAXIMO_SCRIPT_BASE_URL: ${MAXIMO_SCRIPT_BASE_URL:?MAXIMO_SCRIPT_BASE_URL is required}
      MAXIMO_API_KEY: ${MAXIMO_API_KEY:?MAXIMO_API_KEY is required}
      JWT_PRIVATE_KEY_LOCATION: file:/run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt_public_key
    secrets:
      - jwt_private_key
      - jwt_public_key
    restart: unless-stopped

secrets:
  jwt_private_key:
    file: ${JWT_PRIVATE_KEY_FILE:?JWT_PRIVATE_KEY_FILE is required}
  jwt_public_key:
    file: ${JWT_PUBLIC_KEY_FILE:?JWT_PUBLIC_KEY_FILE is required}
